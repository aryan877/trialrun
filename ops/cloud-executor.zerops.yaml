zerops:
  - setup: executor
    build:
      base: ubuntu/nodejs@24
      deployFiles: .
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /health
    run:
      base: ubuntu/nodejs@24
      prepareCommands:
        - PLAYWRIGHT_BROWSERS_PATH=/home/zerops/.cache/ms-playwright PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT=120000 npx --yes playwright@1.62.1 install --with-deps --only-shell chromium
      envVariables:
        PLAYWRIGHT_BROWSERS_PATH: /home/zerops/.cache/ms-playwright
      ports:
        - port: 3000
          httpSupport: true
      start: ./node_modules/.bin/tsx src/index.ts
