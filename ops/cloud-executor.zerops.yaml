zerops:
  - setup: executor
    build:
      base: alpine/nodejs@24
      deployFiles: .
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /health
    run:
      base: alpine/docker@26.1.5
      prepareCommands:
        - docker image pull mcr.microsoft.com/playwright:v1.62.1-noble
      ports:
        - port: 3000
          httpSupport: true
      start: >-
        docker run --rm --init --network=host
        --volume /var/www:/workspace
        --workdir /workspace
        --env PORT
        --env TRIALRUN_EXECUTION_TOKEN
        --env TRIALRUN_REVIEW_ID
        --env TRIALRUN_BASE_URL
        --env TRIALRUN_HEAD_URL
        --env TRIALRUN_BASE_HEALTH_PATH
        --env TRIALRUN_HEAD_HEALTH_PATH
        --env TRIALRUN_TEST_SECRETS_BASE64
        mcr.microsoft.com/playwright:v1.62.1-noble
        ./node_modules/.bin/tsx src/index.ts
