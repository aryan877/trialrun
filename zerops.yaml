zerops:
  - setup: runner
    build:
      base: alpine/nodejs@24
      buildCommands:
        - corepack enable
        - corepack prepare pnpm@9.15.5 --activate
        - pnpm install --frozen-lockfile
        - pnpm --filter @trialrun/runner deploy --prod .deploy/runner
        - pnpm --filter @trialrun/cloud-executor deploy --prod .deploy/executor-source
        - cp ops/cloud-executor.zerops.yaml .deploy/executor-source/zerops.yaml
        - pnpm --filter @trialrun/codex-workspace-bridge artifact
      deployFiles:
        - .deploy/runner
        - .deploy/executor-source
        - .deploy/codex-workspace-source
      cache:
        - node_modules
    run:
      base: alpine/nodejs@24
      ports:
        - port: 3001
          httpSupport: true
      prepareCommands:
        - mkdir -p /home/zerops/.codex && chmod 700 /home/zerops/.codex
      envVariables:
        APP_URL: https://trialrun.aryankumar.dev
        ARTIFACT_DRIVER: s3
        CODEX_ANALYST_ENABLED: "true"
        CODEX_BINARY: /var/www/.deploy/runner/node_modules/.pnpm/node_modules/@openai/codex/bin/codex.js
        CODEX_MODEL: gpt-5.6-sol
        CODEX_REASONING_EFFORT: medium
        EXECUTION_PROVIDER: zerops
        GITHUB_APP_ID: "4526353"
        NODE_ENV: production
        REPOSITORY_MCP_BIND_HOST: 0.0.0.0
        REPOSITORY_MCP_PORT: "3001"
        REPOSITORY_MCP_PUBLIC_URL: https://trialrun.aryankumar.dev/api/agent-tools/repository/mcp
        S3_FORCE_PATH_STYLE: "true"
        S3_REGION: us-east-1
        VAULT_KEY_VERSION: "1"
        ZCLI_BINARY: ./node_modules/.bin/zcli
        TRIALRUN_ZEROPS_API_URL: https://api.app-prg1.zerops.io/api/rest/public
        TRIALRUN_ZEROPS_EXECUTOR_SOURCE_DIRECTORY: /var/www/.deploy/executor-source
        TRIALRUN_CODEX_WORKSPACE_SOURCE_DIRECTORY: /var/www/.deploy/codex-workspace-source
      start: >-
        sh -lc 'cd /var/www/.deploy/runner &&
        ./node_modules/.bin/tsx node_modules/@trialrun/db/src/migrate.ts &&
        ./node_modules/.bin/tsx node_modules/@trialrun/db/src/seed.ts &&
        exec ./node_modules/.bin/tsx src/index.ts'

  - setup: executor
    build:
      base: alpine/nodejs@24
      buildCommands:
        - corepack enable
        - corepack prepare pnpm@9.15.5 --activate
        - pnpm install --frozen-lockfile
        - pnpm --filter @trialrun/cloud-executor deploy --prod .deploy/cloud-executor
      deployFiles: .deploy/cloud-executor
      cache:
        - node_modules
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /health
    run:
      base: alpine/docker@26.1.5
      prepareCommands:
        - docker image pull mcr.microsoft.com/playwright:v1.62.1-noble
      ports:
        - port: 3000
          httpSupport: true
      start: >-
        docker run --rm --init --network=host
        --volume /var/www/.deploy/cloud-executor:/workspace
        --workdir /workspace
        --env PORT
        --env TRIALRUN_EXECUTION_TOKEN
        --env TRIALRUN_REVIEW_ID
        --env TRIALRUN_BASE_URL
        --env TRIALRUN_HEAD_URL
        --env TRIALRUN_BASE_HEALTH_PATH
        --env TRIALRUN_HEAD_HEALTH_PATH
        --env TRIALRUN_TEST_SECRETS_BASE64
        mcr.microsoft.com/playwright:v1.62.1-noble
        ./node_modules/.bin/tsx src/index.ts
