<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 560" role="img" aria-labelledby="planning-title planning-description" preserveAspectRatio="xMidYMid meet" font-family="Instrument Sans, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="planning-title">The repository becomes a Zerops test lab automatically</title>
  <desc id="planning-description">Codex reads the exact commit and works out the application, its data, and the test target. TrialRun checks the answer against hard limits. Zerops then builds the real base and pull request applications, gives each separate data, connects them over a private network, and health-checks the lab before testing begins.</desc>
