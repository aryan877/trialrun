<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 520" role="img" aria-labelledby="architecture-title architecture-description" preserveAspectRatio="xMidYMid meet" font-family="Instrument Sans, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="architecture-title">One PR in. A tested review out.</title>
  <desc id="architecture-description">A six-step TrialRun review. GitHub sends the exact base and pull request commits. Codex reads the repository while TrialRun checks the run plan and limits. Zerops boots isolated base and pull request applications with separate data. Codex tests the code, user interface, and API in live Chrome while TrialRun records real video and evidence. TrialRun deletes the exact temporary project, confirms it is gone, and only then publishes Codex&apos;s verdict to GitHub.</desc>
