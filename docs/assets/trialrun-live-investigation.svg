<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 440" role="img" aria-labelledby="title description" preserveAspectRatio="xMidYMid meet" font-family="Instrument Sans, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="title">One Codex thread investigates code, UI, APIs, and Zerops service logs</title>
  <desc id="description">One Codex thread can run through TrialRun or a customer's private Zerops ZCP workspace. It reads the code and investigates the current and proposed applications through Chrome, HTTP, and Zerops service logs. Both applications and their separate data run inside one private disposable Zerops project.</desc>
