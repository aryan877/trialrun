  <rect width="1200" height="440" fill="#fbfbf8" />
  <text x="40" y="50" font-size="32" font-weight="760" fill="#111111">One Codex thread investigates the whole change.</text>
  <text x="40" y="80" font-size="16" fill="#5f5f59">It moves between the code and the live Zerops lab until it can explain what changed.</text>

