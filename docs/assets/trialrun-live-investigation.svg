<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 520" role="img" aria-labelledby="title description" preserveAspectRatio="xMidYMid meet" font-family="Instrument Sans, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="title">One Codex thread investigates code, UI, APIs, and Zerops service logs</title>
  <desc id="description">A TrialRun review uses either managed Codex or a customer's Codex in a private Zerops ZCP workspace. The selected Codex reads the exact repository, drives Chrome, calls the running applications' APIs, and reads bounded secret-redacted Zerops service logs. The base and pull request applications run with separate data inside one private disposable Zerops project. TrialRun records the cited code, screenshots, WebM recordings, API responses, and service logs as one proof trail.</desc>
