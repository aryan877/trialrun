services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: trialrun
      POSTGRES_USER: trialrun
      POSTGRES_PASSWORD: trialrun
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trialrun -d trialrun"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - trialrun-postgres:/var/lib/postgresql/data

volumes:
  trialrun-postgres:
